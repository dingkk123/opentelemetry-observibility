receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:

  # Trace -> Tempo
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Metrics -> 讓 Prometheus scrape
  prometheus:
    endpoint: "0.0.0.0:9464"

  # Logs -> Elasticsearch
  elasticsearch:
    endpoint: "http://elasticsearch:9200"

  # 開發時方便確認 Collector 有沒有收到資料
  debug:
    verbosity: basic

service:
  pipelines:

    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/tempo
        - debug

    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheus
        - debug

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - elasticsearch
        - debug